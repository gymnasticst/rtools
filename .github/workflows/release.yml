name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version --no-git-tag-version --allow-same-version "$VERSION"
          fi
          mkdir -p release
          npm pack --pack-destination release/
          if [ ! -f "release/rtools-v${VERSION}.tgz" ]; then
            mv "release/rtools-${VERSION}.tgz" "release/rtools-v${VERSION}.tgz"
          fi
          sha256sum release/*.tgz > release/SHASUMS256.txt
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tgz
            release/SHASUMS256.txt
      - name: npm publish
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set — skipping npm publish"
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
